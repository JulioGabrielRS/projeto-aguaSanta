<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de cadastro de currículo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%; /* 100% da altura da viewport */
            width: 100%;
            background-color: #f0f0f0; /* Cor de fundo para melhor visualização */
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover; /* Garante que a imagem cubra a área definida */
        }
    </style>
</head>
<body>
    <img src="images/Curriculo.png" alt="Descrição da Imagem">
</body>
</html>
